services:
  - type: web
    name: fraudflux-api
    runtime: python
    plan: free
    buildCommand: pip install -r dashboard/backend/requirements.txt
    # Single worker: scored uploads are cached in memory for /api/explain.
    startCommand: uvicorn dashboard.backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
